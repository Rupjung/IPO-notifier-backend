services:
  - type: web
    name: sebon-ipo-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Cron job to ping the server every 10 mins
  # This prevents Render free tier from spinning down
  - type: cron
    name: sebon-keep-warm
    runtime: python
    schedule: "*/10 * * * *"
    buildCommand: pip install requests
    startCommand: python -c "import requests; requests.get('https://sebon-ipo-api.onrender.com/ping')"
    plan: free