services:
  - type: web
    name: sebon-ipo-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Timeout increased to 120s — scraper paginates ~600 records with delays
    startCommand: gunicorn app:app --timeout 120 --workers 1
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Cron job to keep Render free tier warm (pings every 10 mins)
  - type: cron
    name: sebon-keep-warm
    runtime: python
    schedule: "*/10 * * * *"
    buildCommand: pip install requests
    startCommand: python -c "import requests; requests.get('https://sebon-ipo-api.onrender.com/ping')"
    plan: free